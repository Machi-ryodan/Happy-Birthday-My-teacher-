<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width">
    <title>Cô Vân Anh ❤️❤️</title>
	<link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            background-color: #05070a;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: crosshair; /* Con trỏ chuột hình tâm ngắm thí nghiệm */
        }
        .container {
            z-index: 10;
            background: rgba(10, 15, 25, 0.85);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #238636;
            box-shadow: 0 0 30px rgba(56, 139, 253, 0.3);
            pointer-events: none; /* Click xuyên qua hộp thoại để kích nổ */
        }
        h1 {
            color: #7ee787;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(126, 231, 135, 0.4);
        }
        .equation {
            color: #ff7b72;
            font-size: 20px;
            font-weight: bold;
            background: #161b22;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
        }
        p {
            color: #c9d1d9;
            font-size: 18px;
            margin: 5px 0;
        }
        .instruction {
            color: #8b949e;
            font-size: 14px;
            font-style: italic;
            margin-top: 15px;
        }
        
        /* Hiệu ứng bong bóng sủi bọt từ bản cũ */
        .bubble {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            z-index: 2;
            animation: floatUp 6s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* Canvas dành riêng cho hiệu ứng nổ click chuột */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Canvas để vẽ pháo hoa nguyên tử -->
    <canvas id="quantumCanvas"></canvas>

    <div class="container">
        <h1>🎉 Chúc Mừng Sinh Nhật Cô Vân Anh 🥳🥳! 🎉</h1>
        <div class="equation">Chúc cô tuổi mới luôn tràn ngập niềm vui và tiếng cười! 🎂🍰</div>
        <p class="instruction">Cô click vào màn hình đi ạ(Đừng spam không lag)</p>
    </div>

    <script>
        // --- PHẦN 1: HIỆU ỨNG SỦI BỌT KHÍ TỰ ĐỘNG  ---
        const chemicals = ['H₂O', 'O₂', 'CO²', 'H₂', 'N₂', '✨', '🧪', '⚗️', '❤️'];

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.innerText = chemicals[Math.floor(Math.random() * chemicals.length)];
            
            const size = Math.random() * 30 + 30;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 4 + 4;
            bubble.style.animationDuration = `${duration}s`;
            
            const colors = ['rgba(56, 139, 253, 0.5)', 'rgba(57, 211, 83, 0.5)', 'rgba(255, 123, 114, 0.5)'];
            bubble.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(bubble);

            setTimeout(() => { bubble.remove(); }, duration * 1000);
        }
        setInterval(createBubble, 300); // Cứ 0.3 giây tạo 1 bong bóng bay lên


        // --- PHẦN 2: HIỆU ỨNG NỔ NGUYÊN TỬ KHI CLICK CHUỘT  ---
        const canvas = document.getElementById('quantumCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let particles = [];
        const atomicSymbols = ['e⁻', 'p⁺', 'n⁰', '☢️', '⚛️', '💥'];

        class AtomicParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 4; 
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.symbol = atomicSymbols[Math.floor(Math.random() * atomicSymbols.length)];
                this.fontSize = Math.random() * 12 + 12;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                
                const colors = ['#39d353', '#58a6ff', '#ff7b72', '#ffdf5d'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // Trọng lực kéo hạt rơi nhẹ xuống
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.fontSize}px 'Courier New'`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillText(this.symbol, this.x, this.y);
                ctx.restore();
            }
        }

        // Kích nổ khi click chuột
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 3; i++) {
                particles.push(new AtomicParticle(e.clientX, e.clientY));
            }
        });

        // Vòng lặp vẽ pháo hoa liên tục
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>

</body>
</html>
